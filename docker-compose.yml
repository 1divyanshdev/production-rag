# production-rag development stack: backend API + Qdrant server.
#
# Usage:
#   docker compose up --build
#   API:  http://localhost:8000/docs
#
# Environment: create a .env file (see .env.example) with your API keys;
# compose passes it into the backend container. The .env file itself is
# never baked into the image.

services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"   # REST
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage

  backend:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Server mode: talk to the qdrant service instead of embedded local mode
      VECTOR_STORE_URL: "http://qdrant:6333"
      VECTOR_COLLECTION: "rag_chunks"
    depends_on:
      - qdrant

volumes:
  qdrant_data:
